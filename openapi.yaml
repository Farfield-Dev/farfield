openapi: 3.1.0
info:
  title: Farfield API
  version: 0.1.0-alpha.1
  description: Immutable, searchable agent history on object storage. The pre-release server has no built-in authentication.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8787
security: []
paths:
  /v1/health:
    get:
      summary: Check server health
      operationId: health
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: {type: boolean}
                  service: {const: farfield}
  /v1/traces:
    post:
      summary: Export OpenTelemetry traces over OTLP/HTTP
      description: Accepts OTLP ExportTraceServiceRequest payloads as protobuf or OTLP JSON. Gzip content encoding is supported. Valid spans are durably committed in idempotent conversation-local segments; invalid spans are reported through OTLP partial_success.
      operationId: exportOTLPTraces
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: {type: string, format: binary}
          application/protobuf:
            schema: {type: string, format: binary}
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: OTLP export accepted, possibly with partial span rejection
          content:
            application/x-protobuf:
              schema: {type: string, format: binary}
            application/json:
              schema:
                type: object
                properties:
                  partialSuccess:
                    type: object
                    properties:
                      rejectedSpans: {type: integer, minimum: 0}
                      errorMessage: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/history/records:
    post:
      summary: Append an immutable History record
      operationId: appendHistoryRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppendRecord"}
      responses:
        "201":
          description: Immutable record committed or idempotently recovered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Record"}
        "409": {$ref: "#/components/responses/Error"}
    get:
      summary: Query History records
      operationId: queryHistoryRecords
      parameters:
        - {in: query, name: conversation_id, schema: {type: string}}
        - {in: query, name: trace_id, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string}}
        - {in: query, name: agent, schema: {type: string}}
        - {in: query, name: tool, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: tag, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "Repeatable exact key=value tag filter"}
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Record"}
  /v1/history/records/{record_id}:
    get:
      summary: Read a record and its content
      operationId: getHistoryRecord
      parameters:
        - {in: path, name: record_id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Record with hydrated content
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entry"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/history/segments:
    post:
      summary: Atomically append a batch of records as one immutable segment
      operationId: appendHistorySegment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppendSegment"}
      responses:
        "201":
          description: Segment durably committed or idempotently recovered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Segment"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/history/search:
    get:
      summary: Search indexed History content with exact metadata filters
      operationId: searchHistory
      parameters:
        - {in: query, name: q, schema: {type: string}, description: "Bare terms are ANDed; quotes form phrases and a trailing * performs prefix matching"}
        - {in: query, name: conversation_id, schema: {type: string}}
        - {in: query, name: trace_id, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string}}
        - {in: query, name: agent, schema: {type: string}}
        - {in: query, name: tool, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: tag, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "Repeatable exact key=value tag filter"}
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: Ranked search hits from the disposable local index
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResult"}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/history/conversations:
    get:
      summary: List conversation summaries
      operationId: listConversations
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: Conversation summaries ordered by most recent activity
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Conversation"}
  /v1/history/conversations/{conversation_id}/timeline:
    get:
      summary: Read a hydrated conversation timeline
      operationId: getConversationTimeline
      parameters:
        - {in: path, name: conversation_id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Hydrated records in event-time order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Entry"}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: Stable Farfield error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    AppendRecord:
      type: object
      required: [conversation_id, kind, content]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        kind: {type: string}
        content: {}
        occurred_at: {type: string, format: date-time}
        sequence: {type: integer, minimum: 0}
        trace_id: {type: string}
        span_id: {type: string}
        parent_id: {type: string}
        agent: {type: string}
        tool: {type: string}
        status: {type: string}
        tags: {type: object, additionalProperties: {type: string}}
      additionalProperties: false
    AppendSegment:
      type: object
      required: [records]
      properties:
        id: {type: string, description: Stable segment ID for idempotent retries}
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/AppendRecord"}
      additionalProperties: false
    Segment:
      type: object
      required: [schema_version, id, conversation_id, conversation_hash, created_at, entries, segment_sha256]
      properties:
        schema_version: {const: farfield.history.segment.v1}
        id: {type: string}
        conversation_id: {type: string}
        conversation_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        created_at: {type: string, format: date-time}
        entries:
          type: array
          items: {$ref: "#/components/schemas/SegmentEntry"}
        segment_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    Record:
      type: object
      required: [schema_version, id, conversation_id, kind, occurred_at, recorded_at, tags, content, record_sha256]
      properties:
        schema_version: {const: farfield.history.record.v2}
        id: {type: string}
        conversation_id: {type: string}
        kind: {type: string}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        sequence: {type: [integer, "null"], minimum: 0}
        trace_id: {type: [string, "null"]}
        span_id: {type: [string, "null"]}
        parent_id: {type: [string, "null"]}
        agent: {type: [string, "null"]}
        tool: {type: [string, "null"]}
        status: {type: [string, "null"]}
        tags: {type: object, additionalProperties: {type: string}}
        content: {$ref: "#/components/schemas/ContentRef"}
        record_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    ContentRef:
      type: object
      required: [sha256, size, media_type, key]
      properties:
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        size: {type: integer, minimum: 0}
        media_type: {type: string}
        key: {type: string}
        storage: {type: string, enum: [segment, blob]}
        entry_index: {type: integer, minimum: 0}
    SegmentEntry:
      type: object
      required: [record]
      properties:
        record: {$ref: "#/components/schemas/Record"}
        content: {}
    Entry:
      type: object
      required: [record, content]
      properties:
        record: {$ref: "#/components/schemas/Record"}
        content: {}
    Conversation:
      type: object
      required: [id, record_count, first_seen_at, last_seen_at, agents, kinds]
      properties:
        id: {type: string}
        record_count: {type: integer, minimum: 1}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        agents: {type: array, items: {type: string}}
        kinds: {type: array, items: {type: string}}
    SearchHit:
      type: object
      required: [record, score]
      properties:
        record: {$ref: "#/components/schemas/Record"}
        score: {type: number, minimum: 0}
        snippet: {type: string}
    SearchResult:
      type: object
      required: [hits, total, took_ms, indexed_records, index_updated_at]
      properties:
        hits: {type: array, items: {$ref: "#/components/schemas/SearchHit"}}
        total: {type: integer, minimum: 0}
        took_ms: {type: number, minimum: 0}
        indexed_records: {type: integer, minimum: 0}
        index_updated_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
