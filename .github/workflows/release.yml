name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci --prefix sdk/typescript && npm run check --prefix sdk/typescript
      - run: python -m pip install -e './sdk/python[dev]'
      - run: ruff check sdk/python && ruff format --check sdk/python && pyright -p sdk/python
      - run: python -W error::ResourceWarning -m unittest discover -s sdk/python/tests -v
      - run: python -m build sdk/python
      - run: npx --yes @redocly/cli@2.46.2 lint openapi.yaml

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then suffix=".exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -trimpath \
            -ldflags="-s -w -X github.com/Farfield-Dev/farfield/internal/buildinfo.Version=${GITHUB_REF_NAME#v}" \
            -o "dist/farfield_${{ matrix.goos }}_${{ matrix.goarch }}${suffix}" ./cmd/farfield
      - uses: actions/upload-artifact@v4
        with:
          name: farfield_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum farfield_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          dist/*
