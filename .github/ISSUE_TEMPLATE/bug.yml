name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid including prompts, credentials, customer data, or other sensitive record content.
  - type: input
    id: version
    attributes:
      label: Farfield version
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Storage backend
      options: [Local filesystem, Amazon S3, S3-compatible]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe commands or code that reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
