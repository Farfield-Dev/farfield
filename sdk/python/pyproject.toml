[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "farfield"
version = "0.1.0a1"
description = "Durable agent history and execution, stored in object storage you control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Farfield contributors"}]
keywords = ["agents", "observability", "durable-execution", "s3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
claude-agent-sdk = [
  "claude-agent-sdk>=0.2,<1",
]
openai-agents = [
  "openai-agents>=0.22,<1",
]
dev = [
  "build>=1.3",
  "claude-agent-sdk>=0.2,<1",
  "openai-agents>=0.22,<1",
  "pyright>=1.1.405",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/Farfield-Dev/farfield"
Documentation = "https://github.com/Farfield-Dev/farfield/tree/main/sdk/python"
Issues = "https://github.com/Farfield-Dev/farfield/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/farfield"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP007"] # Union keeps this recursive alias importable on Python 3.10.
