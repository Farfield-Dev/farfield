[project]
name = "farfield-personal-agent"
version = "0.1.0"
description = "A web-research personal agent with durable Farfield history and runs"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "farfield",
  "python-dotenv>=1.1",
]

[tool.uv.sources]
farfield = { path = "../../sdk/python", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
